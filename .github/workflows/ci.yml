name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --all-extras
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
        postgres: ["16", "17"]
        maf: ["pinned", "latest"]
        exclude:
          - postgres: "16"
            maf: "latest"
    continue-on-error: ${{ matrix.maf == 'latest' }}
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agent_framework
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d agent_framework"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      POSTGRES_TEST_CONNECTION_STRING: postgresql://postgres:postgres@127.0.0.1:5433/agent_framework
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --all-extras
      # Canary: re-resolve the two MAF packages to the newest release the
      # declared ranges allow, then sync that lock into the same .venv the
      # test step runs in. `uv run` below keeps the upgraded lock.
      - if: matrix.maf == 'latest'
        run: |
          uv lock --upgrade-package agent-framework-core --upgrade-package agent-framework-ag-ui
          uv sync --all-extras
      - run: uv pip show agent-framework-core agent-framework-ag-ui
      - run: uv run --python ${{ matrix.python }} python -c "import sys; print(sys.version)"
      - run: uv run --python ${{ matrix.python }} pytest -v
