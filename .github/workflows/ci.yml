name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - run: uv sync --all-extras
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
        postgres: ["16", "17"]
        maf: ["pinned", "latest"]
        exclude:
          - postgres: "16"
            maf: "latest"
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agent_framework
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d agent_framework"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      POSTGRES_TEST_CONNECTION_STRING: postgresql://postgres:postgres@127.0.0.1:5433/agent_framework
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --all-extras
      # Latest: re-resolve the two MAF packages to the newest release the
      # declared ranges allow, then sync that lock into the same .venv the
      # test step runs in. `uv run` below keeps the upgraded lock. The ranges
      # are the supported range, so this leg blocks a merge. A minor newer
      # than the tested ones warns at import; this leg ignores that warning
      # (it tests behaviour), while the pinned leg keeps it an error.
      - if: matrix.maf == 'latest'
        run: |
          uv lock --upgrade-package agent-framework-core --upgrade-package agent-framework-ag-ui
          uv sync --all-extras
      - run: uv pip show agent-framework-core agent-framework-ag-ui
      - run: uv run --python ${{ matrix.python }} python -c "import sys; print(sys.version)"
      - if: matrix.maf == 'pinned'
        run: uv run --python ${{ matrix.python }} pytest -v
      - if: matrix.maf == 'latest'
        run: uv run --python ${{ matrix.python }} pytest -v -W "ignore:community-agent-framework-postgres has not been tested"
