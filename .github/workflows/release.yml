name: Release

# Publishing is a manual step: it starts only when a GitHub Release is published for a tag vX.Y.Z,
# never on a tag push, and the upload then waits in the `pypi` environment for a reviewer to approve it.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # The full suite, integration tests included, must pass before anything is built or published.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agent_framework
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d agent_framework"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      POSTGRES_TEST_CONNECTION_STRING: postgresql://postgres:postgres@127.0.0.1:5433/agent_framework
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # The ancestor check below needs main's history.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          # A release build never restores a cache another workflow wrote.
          enable-cache: false
      - name: Check that the release tag is v + project.version
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Release tag $GITHUB_REF_NAME is not v$version (project.version)." >&2
            exit 1
          fi
      - name: Check that the tagged commit is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "The release tag $GITHUB_REF_NAME points at a commit that is not on main." >&2
            exit 1
          fi
      - run: uv sync --locked --all-extras
      - run: uv run pytest -v
      - run: uv build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/

  # Checks run in their own job on a downloaded copy, so nothing they install can change the files publish uploads.
  verify:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/
      - run: uv sync --locked --no-default-groups --group release
      - run: uv run --no-sync twine check --strict dist/*
      - name: Import the built wheel
        run: |
          wheel=$(ls dist/*.whl)
          check="import agent_framework_community_postgres as p; assert p.__version__ == '${GITHUB_REF_NAME#v}'"
          uv run --isolated --no-project --with "$wheel" python -c "$check"

  publish:
    needs: [build, verify]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
