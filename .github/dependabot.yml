version: 2
updates:
  # Every action in .github/workflows is pinned by commit SHA with its tag in a comment.
  # Dependabot keeps those pins current: it opens a pull request that changes the SHA and the comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # Security and maintenance updates for the locked development environment. The lock pins the lowest
  # supported MAF on purpose (CI's "latest" leg tests the newest), so the two MAF packages are left alone.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: agent-framework-core
      - dependency-name: agent-framework-ag-ui
