[project]
name = "community-agent-framework-postgres"
version = "0.1.2"
description = "PostgreSQL storage for Microsoft Agent Framework: chat history, sessions, workflow checkpoints, AG-UI thread snapshots and leases."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Matias Suxo Salinas" }]
keywords = ["agent-framework", "microsoft-agent-framework", "postgresql", "psycopg", "checkpoint", "history-provider", "session-store"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Database",
  "Typing :: Typed",
]
dependencies = [
  "agent-framework-core>=1.20.0,<2",
  "psycopg[binary,pool]>=3.3.5,<4",
]

[project.optional-dependencies]
ag-ui = ["agent-framework-ag-ui>=1.5.0,<2"]
# azure-identity's aio credentials need an async HTTP transport, which azure-core takes from aiohttp.
azure = ["azure-identity>=1.19,<2", "aiohttp>=3.9,<4"]

[project.urls]
Source = "https://github.com/matias-io/community-agent-framework-postgres"
Issues = "https://github.com/matias-io/community-agent-framework-postgres/issues"
Changelog = "https://github.com/matias-io/community-agent-framework-postgres/blob/main/CHANGELOG.md"
Documentation = "https://github.com/matias-io/community-agent-framework-postgres/tree/main/docs"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=1.4",
  "pytest-timeout>=2.3",
  "ruff>=0.14",
  "pyright>=1.1.400",
  "agent-framework-ag-ui>=1.5.0,<2",
  "azure-identity>=1.19,<2",
  "aiohttp>=3.9,<4",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_framework_community_postgres"]

[tool.hatch.build.targets.sdist]
include = [
  "src", "tests", "docs", "samples", "README.md", "CHANGELOG.md", "LICENSE",
  "CONTRIBUTING.md", "docker-compose.yml", "uv.lock",
]

[tool.uv]
prerelease = "if-necessary"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
timeout = 120
addopts = "-ra -q --strict-markers --import-mode=importlib"
markers = ["integration: needs POSTGRES_TEST_CONNECTION_STRING and a reachable PostgreSQL"]
filterwarnings = ["error", "ignore::agent_framework._feature_stage.ExperimentalWarning"]

# Microsoft agent-framework's ruff settings (python/pyproject.toml), less its copyright-notice rule, which
# applies to Microsoft's own files, and with this package's own docstring exemptions.
[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]
preview = true

[tool.ruff.lint]
select = [
  "ASYNC", "B", "D", "E", "ERA", "F", "FIX", "I", "INP", "ISC", "Q", "RET", "RSE", "RUF", "S", "SIM", "T100",
  "T20", "TD", "W",
]
ignore = [
  "D100", "D104", "D105", "D107", "D203", "D213", "D418", "D421", "TD003", "FIX002", "ASYNC119", "B027", "B905",
  "RUF067", "RUF201",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "INP", "TD", "ERA001", "RUF", "S"]
"samples/**" = ["D", "INP", "ERA001", "RUF", "S", "T20"]
"src/agent_framework_community_postgres/_cli.py" = ["T20"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
docstring-code-format = true

# Microsoft agent-framework's pyright settings: strict, and a stale ignore comment or cast is an error.
[tool.pyright]
include = ["src"]
typeCheckingMode = "strict"
pythonVersion = "3.11"
reportUnnecessaryIsInstance = false
reportMissingTypeStubs = false
reportUnnecessaryCast = "error"
reportUnnecessaryTypeIgnoreComment = "error"
