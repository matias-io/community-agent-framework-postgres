[project]
name = "community-agent-framework-postgres"
version = "0.1.0"
description = "PostgreSQL storage for Microsoft Agent Framework: chat history, sessions, workflow checkpoints, AG-UI thread snapshots, documents and leases."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Matias Suxo Salinas" }]
keywords = ["agent-framework", "microsoft-agent-framework", "postgresql", "psycopg", "checkpoint", "history-provider", "session-store"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Database",
  "Typing :: Typed",
]
dependencies = [
  "agent-framework-core>=1.19.0,<2",
  "psycopg[binary,pool]>=3.3.5,<4",
]

[project.optional-dependencies]
ag-ui = ["agent-framework-ag-ui>=1.4.0,<2"]

[project.urls]
Source = "https://github.com/matias-io/community-agent-framework-postgres"
Issues = "https://github.com/matias-io/community-agent-framework-postgres/issues"
Changelog = "https://github.com/matias-io/community-agent-framework-postgres/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=1.4",
  "pytest-timeout>=2.3",
  "ruff>=0.14",
  "pyright>=1.1.400",
  "agent-framework-ag-ui>=1.4.0,<2",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_framework_community_postgres"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "samples", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.uv]
prerelease = "if-necessary"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
timeout = 120
addopts = "-ra -q --strict-markers"
markers = ["integration: needs POSTGRES_TEST_CONNECTION_STRING and a reachable PostgreSQL"]
filterwarnings = ["ignore::agent_framework._feature_stage.ExperimentalWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ASYNC", "B", "D", "E", "F", "I", "ISC", "Q", "RET", "RSE", "RUF", "S", "SIM", "T20", "W"]
ignore = ["D100", "D104", "D105", "D107", "D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "S", "RUF"]
"samples/**" = ["D", "T20", "S"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pyright]
include = ["src"]
typeCheckingMode = "strict"
pythonVersion = "3.11"
